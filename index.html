<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 宝宝的点单小铺</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-content">
            <h1 class="logo">💖 宝宝的点单小铺</h1>
            <p class="subtitle">想吃什么、想要什么，尽管点！我都会满足你~</p>
            <div class="header-actions">
                <button class="btn-cart" onclick="toggleCart()">
                    <i class="fas fa-shopping-cart"></i>
                    <span>购物车</span>
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 分类导航 -->
    <nav class="category-nav">
        <div class="category-list" id="categoryList">
            <!-- 动态生成 -->
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">
        <div class="products-grid" id="productsGrid">
            <!-- 动态生成 -->
        </div>
    </main>

    <!-- 购物车侧边栏 -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <aside class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>🛒 我的购物车</h2>
            <button class="btn-close" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <p class="cart-empty">购物车空空如也~ 快去选点什么吧！</p>
        </div>
        <div class="cart-footer" id="cartFooter" style="display:none;">
            <div class="cart-total">
                <span>共 <strong id="cartCount">0</strong> 件</span>
            </div>
            <textarea class="cart-note" id="cartNote" placeholder="给男朋友留个言吧...（选填）" rows="2"></textarea>
            <button class="btn-submit-order" onclick="submitOrder()">
                <i class="fas fa-paper-plane"></i> 下单啦~
            </button>
        </div>
    </aside>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
